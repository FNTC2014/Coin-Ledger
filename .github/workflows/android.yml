name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Check the secrets
        id: secret
        env:
          KEYSTORE_PASSPHRASE: ${{ secrets.KEYSTORE_PASSPHRASE }}
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          if [ -z "$FIREBASE_CONFIG" ]; then
            echo "::warning::The FIREBASE_CONFIG secret isn't set yet, so the app will say it isn't connected to Firebase."
          fi
          if [ -z "$KEYSTORE_PASSPHRASE" ]; then
            echo "::warning::The KEYSTORE_PASSPHRASE secret isn't set yet, so this build is checked but not published."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the page
        env:
          APP_VERSION: 1.0.${{ github.run_number }}
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Unlock the signing key
        if: steps.secret.outputs.signed == 'true'
        env:
          KEYSTORE_PASSPHRASE: ${{ secrets.KEYSTORE_PASSPHRASE }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in android/app/signing/coinledger.p12.enc \
            -out android/app/signing/coinledger.p12 \
            -pass env:KEYSTORE_PASSPHRASE

      - name: Build the app
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          SIGNING_STORE_FILE: ${{ steps.secret.outputs.signed == 'true' && 'signing/coinledger.p12' || '' }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSPHRASE }}
          SIGNING_KEY_ALIAS: coinledger
          SIGNING_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSPHRASE }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee gradle.log

      - name: Report build errors
        if: failure()
        working-directory: android
        run: |
          if [ -f gradle.log ]; then
            msg=$(grep -E "error:|warning: \[|What went wrong|e: |FAILED|Exception" -A2 gradle.log | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Gradle::${msg}"
          fi

      - name: Publish the download
        if: steps.secret.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="CoinLedger-1.0.${{ github.run_number }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          gh release create "v1.0.${{ github.run_number }}" "$APK" \
            --title "Coin Ledger 1.0.${{ github.run_number }}" \
            --notes "On your phone, download $APK below and open it to install or update. The version number shows on the sign-in screen and in Settings. Built from ${{ github.sha }}." \
            --latest
